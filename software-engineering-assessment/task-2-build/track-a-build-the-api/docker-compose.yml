# Fenwick & Co. storefront — full stack.
#
#     docker compose up
#
# Works on a clean clone with no manual step: every variable below carries a
# development default, and `.env` (see .env.example) only overrides them.
#
# Service names are roles, not products — `db` and `cache` — because the URLs
# that reference them (DATABASE_URL, REDIS_URL) outlive any decision about
# which engine sits behind them.
name: fenwick

services:
  # ── Storefront ───────────────────────────────────────────────────────────
  # Serves the SPA, writes window.APP_CONFIG at boot, and reverse-proxies /api
  # to the API. This is the ONLY entrance to the stack: the API is not published
  # on the host, so nothing can bypass it.
  #
  # API_BASE_URL is a same-origin path, not a host URL. The browser therefore
  # never makes a cross-origin request, so CORS does not apply at all.
  # nginx.conf is modified from the provided version; the Dockerfile is not.
  storefront:
    build: ./frontend
    ports:
      - "${STOREFRONT_PORT:-8080}:80"
    environment:
      API_BASE_URL: "${API_BASE_URL:-/api}"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts resolves localhost to ::1 first and
      # nginx here listens on IPv4 only, so `localhost` reports a healthy
      # service as unhealthy — which would then block anything waiting on it.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Payments gateway ─────────────────────────────────────────────────────
  # Provided, unmodified. State is in memory and is lost on restart, which is
  # why `restart` is left at the default: an unattended restart would silently
  # discard the charge ledger the API reconciles against.
  payments:
    build: ./payments-mock
    ports:
      - "${PAYMENTS_PORT:-9090}:9090"
    healthcheck:
      # node:22-alpine has no curl; global fetch is available in Node 22.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  # System of record: users, products, coupons, carts, orders. Money is stored
  # as numeric, never float — the storefront exchanges decimal strings.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-fenwick}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fenwick}"
      POSTGRES_DB: "${POSTGRES_DB:-fenwick}"
    ports:
      # Host-side convenience only; containers use db:5432 regardless.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Named database, not just the server: `pg_isready` without -d reports
      # ready before the initdb bootstrap has created it.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Redis ────────────────────────────────────────────────────────────────
  # Sessions and the POST /orders idempotency keys. Persistence is ON: an
  # idempotency key that disappears on restart lets a retried checkout charge
  # the customer a second time, so this cache is not disposable.
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # ── One-shot migrator ────────────────────────────────────────────────────
  # Applies Prisma migrations and loads seed.json, then exits 0. The API waits
  # on `service_completed_successfully`, so a failed migrate never boots a
  # server against an empty or half-applied schema.
  #
  # Same image family as `api`, different target: this stage keeps the Prisma
  # CLI and tsx; the runtime image does not. No restart: a crash-loop would
  # hide a bad migration behind "still starting".
  api-migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://fenwick:fenwick@db:5432/fenwick?schema=public}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API (NestJS) ─────────────────────────────────────────────────────────
  # Listens on 3000 inside the compose network only. nginx is the entrance;
  # this service is deliberately unpublished on the host.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: api
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      API_PORT: "${API_PORT:-3000}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://fenwick:fenwick@db:5432/fenwick?schema=public}"
      REDIS_URL: "${REDIS_URL:-redis://cache:6379}"
      JWT_SECRET: "${JWT_SECRET:-dev-only-not-a-real-secret-change-me}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-86400}"
      PAYMENTS_URL: "${PAYMENTS_URL:-http://payments:9090}"
      PAYMENTS_TIMEOUT_MS: "${PAYMENTS_TIMEOUT_MS:-15000}"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — same IPv6 trap as the storefront check.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s

  # ── Auth e2e (profile: test) ─────────────────────────────────────────────
  # Speaks to the storefront like a browser: same origin /api, nginx rewrite,
  # API unpublished. Not started by `docker compose up`.
  #
  #     docker compose --profile test run --rm api-e2e
  api-e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: api/Dockerfile
      target: e2e
    environment:
      BASE_URL: http://storefront/api
      SEED_PATH: /app/seed.json
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  redis-data:
