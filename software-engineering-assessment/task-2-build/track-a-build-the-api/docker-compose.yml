services:
  storefront:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      # Point this at wherever your API ends up listening.
      API_BASE_URL: "http://localhost:3000"

  payments:
    build: ./payments-mock
    ports:
      - "9090:9090"

