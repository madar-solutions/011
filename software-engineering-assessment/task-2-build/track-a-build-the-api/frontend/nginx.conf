server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server. The upstream address is held in a variable on
  # purpose: with a literal `proxy_pass http://api:3000` nginx resolves the name
  # once, at startup, so it REFUSES TO START while the API is down and then pins
  # the first address it saw for the life of the worker — which is the wrong one
  # after the API container is recreated. Resolving per request costs nothing
  # here and keeps the storefront servable while the API is restarting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Everything the browser sends to the API arrives here. nginx is the only way
  # in: the API is not published on the host, so no request can bypass this
  # server block (security policy — rate limits, body limits, headers — lands
  # here in a later commit).
  location /api/ {
    set $api_upstream http://api:3000;

    # Strip the /api prefix so the API's own routes stay exactly as documented
    # in API_NOTES.md — /auth/login, /products, /cart — with no global prefix
    # inside the application. The proxy owns the mount point, not the app.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization and X-Request-Id are forwarded as-is; nginx only drops
    # headers it is told to.

    # The storefront aborts every request after 8s, while the payments gateway's
    # slow test card takes ~9s. Without this, a customer's abort tears down the
    # upstream request mid-charge. The API must be allowed to finish settling a
    # payment it has already started — the retry that follows is made safe by
    # idempotency, not by cancelling work.
    proxy_ignore_client_abort on;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /config.js {
    add_header Cache-Control "no-store";
  }
}
